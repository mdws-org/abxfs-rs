# Daily: fail, which sends the repository's owners a notice, when
#   - a beacon node reports a fork that site/light.js does not know,
#   - the block root shipped on main is within four days of the 14 it is trusted for, or
#   - a project's root can no longer be proved from that block root through the listed servers.
name: watch
on:
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fork schedule against site/light.js
        run: python3 tools/fork-watch.py
      - name: Age of the shipped block roots
        run: python3 tools/checkpoint.py --check --warn-days 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: A project's root is still provable from the shipped block root
        run: node tests/proved-live.mjs
